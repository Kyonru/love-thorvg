<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a131d">
  <title>love-thorvg · LÖVE web example</title>
  <link rel="stylesheet" href="example.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="https://github.com/Kyonru/love-thorvg">love-thorvg</a>
    <div class="header-meta">
      <span class="experiment">Experimental</span>
      <a href="https://kyonru.github.io/love-thorvg/experimental/web/">Source &amp; setup</a>
    </div>
  </header>

  <main>
    <section class="runner" aria-label="Interactive LÖVE web example">
      <div class="canvas-frame">
        <canvas id="canvas" width="720" height="720" tabindex="0" aria-label="LÖVE game rendering repository Lottie examples"></canvas>
        <div class="loading" id="loading" aria-hidden="true">
          <span></span>
          Booting LÖVE…
        </div>
      </div>
      <div class="proof-bar">
        <p id="status" role="status" aria-live="polite" data-love-ready="false">Loading the custom runtime…</p>
        <p id="asset-status">Waiting for Lua</p>
      </div>
    </section>
  </main>

  <script src="example.js"></script>
  <script src="game.js"></script>
  <script src="love.js"></script>
</body>
</html>
