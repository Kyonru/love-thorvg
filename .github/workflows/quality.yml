name: native artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
          - name: macOS x64
            runner: macos-15-intel
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Windows x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install meson ninja
      - run: meson setup build --wrap-mode=forcefallback
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - run: python -m unittest tests.test_combine_packages
      - run: python scripts/stage.py build dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
