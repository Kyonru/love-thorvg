name: native artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
          - name: macOS x64
            runner: macos-15-intel
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Windows x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install meson ninja
      - run: meson setup build --wrap-mode=forcefallback
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
      - name: Install headless LÖVE
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y love xvfb xauth
      - name: Verify Lua SVG font integration
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p build/love-font-test/love_thorvg/native/linux-x64
          cp tests/love-fonts/*.lua tests/assets/Abel-Regular.ttf build/love-font-test/
          cp love_thorvg/*.lua build/love-font-test/love_thorvg/
          cp build/liblove_thorvg.so build/love-font-test/love_thorvg/native/linux-x64/
          timeout 60s xvfb-run -a love build/love-font-test
      - run: python -m unittest tests.test_combine_packages
      - run: python scripts/stage.py build dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
