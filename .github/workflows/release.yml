name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            artifact: macos-arm64
          - name: macOS x64
            runner: macos-15-intel
            artifact: macos-x64
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
          - name: Windows x64
            runner: windows-2025
            artifact: windows-x64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release metadata
        run: python scripts/check_release.py "${{ github.ref_name }}"

      - name: Install build tools
        run: python -m pip install meson ninja

      - name: Configure
        run: meson setup build --wrap-mode=forcefallback

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Package
        run: python scripts/stage.py build dist --version "${{ github.ref_name }}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release metadata
        run: python scripts/check_release.py "${{ github.ref_name }}"

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/*.zip
          --generate-notes
          --title "love-thorvg ${{ github.ref_name }}"
