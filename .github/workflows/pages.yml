name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "include/**"
      - "love_thorvg/**"
      - "examples/web/**"
      - "native/**"
      - "scripts/build_web_example.sh"
      - "subprojects/**"
      - "web/**"
      - "tests/web_wasm_test.mjs"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation and build tools
        run: python -m pip install -r requirements-docs.txt meson ninja

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.12"

      - name: Build the custom LÖVE runtime and example
        run: ./scripts/build_web_example.sh build-lovejs web-proof

      - name: Verify the WebAssembly core
        run: node tests/web_wasm_test.mjs "$PWD/build-lovejs/core/love_thorvg_web.js"

      - name: Build site
        run: zensical build --clean --strict

      - name: Add the live LÖVE example
        run: |
          mkdir -p site/experimental/web-demo
          cp -R web-proof/. site/experimental/web-demo/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
