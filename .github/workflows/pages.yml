name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "include/**"
      - "love_thorvg/**"
      - "examples/web/**"
      - "native/**"
      - "subprojects/**"
      - "web/**"
      - "tests/web_wasm_test.mjs"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Zensical
        run: python -m pip install -r requirements-docs.txt

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: Install WebAssembly build tools
        run: python -m pip install meson ninja

      - name: Build and verify experimental WebAssembly backend
        run: |
          meson setup build-web --cross-file web/emscripten.ini -Dbuild_tests=false -Dweb_harness=true -Dthorvg:threads=false -Dthorvg:simd=false -Dthorvg:file=false --wrap-mode=forcefallback
          meson compile -C build-web
          node tests/web_wasm_test.mjs "$PWD/build-web/love_thorvg_web.js"

      - name: Build site
        run: zensical build --clean --strict

      - name: Add live WebAssembly proof
        run: |
          mkdir -p site/experimental/web-demo
          cp examples/web/index.html examples/web/example.css examples/web/example.js site/experimental/web-demo/
          cp build-web/love_thorvg_web.js build-web/love_thorvg_web.wasm site/experimental/web-demo/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
