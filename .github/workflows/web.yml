name: Experimental web backend

on:
  push:
    branches: [main]
    paths:
      - "include/**"
      - "love_thorvg/**"
      - "examples/web/**"
      - "native/**"
      - "scripts/build_web_example.sh"
      - "subprojects/**"
      - "tests/web_love_test.mjs"
      - "tests/web_wasm_test.mjs"
      - "web/**"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "include/**"
      - "love_thorvg/**"
      - "examples/web/**"
      - "native/**"
      - "scripts/build_web_example.sh"
      - "subprojects/**"
      - "tests/web_love_test.mjs"
      - "tests/web_wasm_test.mjs"
      - "web/**"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: "6.0.12"
      - name: Install build tools
        run: python -m pip install meson ninja
      - name: Compile-check the Lua 5.1 bridge
        run: |
          sudo apt-get update
          sudo apt-get install --yes liblua5.1-0-dev
          c++ -std=c++17 -fsyntax-only web/love_thorvg_lua.cpp web/register_module.cpp -Iinclude -I/usr/include/lua5.1
      - name: Build the custom LÖVE runtime and example
        run: ./scripts/build_web_example.sh build-lovejs web-proof
      - name: Decode and render SVG and Lottie in Node
        run: node tests/web_wasm_test.mjs "$PWD/build-lovejs/core/love_thorvg_web.js"
      - name: Install Chromium proof runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the LÖVE game in Chromium
        run: node tests/web_love_test.mjs web-proof web-proof.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: experimental-web-proof
          path: |
            web-proof
            web-proof.png
          if-no-files-found: warn
